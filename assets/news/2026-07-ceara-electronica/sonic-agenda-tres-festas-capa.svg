<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Três festas, dois fins de semana</title>
  <desc id="desc">Capa editorial do Jornal Sonic com o mesmo destaque para FCME, Naturaíz e Cosmic Crew.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131a"/>
      <stop offset="0.5" stop-color="#0d1018"/>
      <stop offset="1" stop-color="#16101b"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#f5efe3" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <style>
      .sans { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .condensed { font-family: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", sans-serif; }
      .serif { font-family: "Iowan Old Style", Georgia, serif; }
      .cream { fill: #f5efe3; }
      .ink { fill: #101117; }
      .label { font-size: 24px; font-weight: 800; letter-spacing: 5px; }
      .event { font-size: 58px; font-weight: 900; letter-spacing: -2px; }
      .date { font-size: 74px; font-weight: 900; letter-spacing: -3px; }
      .place { font-size: 29px; font-weight: 700; letter-spacing: 1px; }
      .handle { font-size: 25px; font-weight: 700; letter-spacing: .5px; }
    </style>
  </defs>

  <rect width="1600" height="1600" fill="url(#background)"/>
  <rect width="1600" height="1600" fill="url(#grid)"/>
  <circle cx="175" cy="850" r="230" fill="#67e8df" opacity=".09" filter="url(#glow-cyan)"/>
  <circle cx="800" cy="850" r="230" fill="#c9ff4a" opacity=".08" filter="url(#glow-green)"/>
  <circle cx="1425" cy="850" r="230" fill="#ff5c9d" opacity=".08" filter="url(#glow-pink)"/>

  <g class="sans">
    <text x="80" y="112" class="cream label">JORNAL SONIC</text>
    <text x="1520" y="112" text-anchor="end" fill="#c7c8cb" class="label">AGENDA 2026</text>
    <line x1="80" y1="150" x2="1520" y2="150" stroke="#f5efe3" stroke-opacity=".6" stroke-width="2"/>
  </g>

  <g class="cream">
    <text x="800" y="272" text-anchor="middle" class="serif" font-size="88" font-weight="700" letter-spacing="-3">Três festas.</text>
    <text x="800" y="374" text-anchor="middle" class="condensed" font-size="116" font-weight="900" letter-spacing="-4">DOIS FINS DE SEMANA.</text>
  </g>
  <text x="800" y="438" text-anchor="middle" class="sans" fill="#c7c8cb" font-size="29" font-weight="600" letter-spacing="2">CEARÁ  →  SÃO PAULO  ·  25 JUL — 02 AGO</text>

  <g transform="translate(80 520)">
    <rect width="456" height="830" rx="16" fill="#0a161d" stroke="#67e8df" stroke-width="4"/>
    <rect x="20" y="20" width="416" height="18" rx="9" fill="#67e8df"/>
    <text x="32" y="98" class="sans label" fill="#67e8df">01 · FORTALEZA</text>
    <text x="32" y="195" class="condensed cream event">FCME</text>
    <line x1="32" y1="235" x2="424" y2="235" stroke="#67e8df" stroke-opacity=".55" stroke-width="2"/>

    <text x="32" y="346" class="condensed cream date">25 JUL</text>
    <text x="32" y="397" class="sans place" fill="#67e8df">22H → 08H</text>

    <g transform="translate(32 475)" fill="none" stroke="#67e8df" stroke-width="5">
      <path d="M0 50H392"/>
      <circle cx="0" cy="50" r="12" fill="#67e8df"/>
      <circle cx="196" cy="50" r="12" fill="#0a161d"/>
      <circle cx="392" cy="50" r="12" fill="#67e8df"/>
      <path d="M68 20v60M128 35v30M264 35v30M324 20v60" stroke-opacity=".55"/>
    </g>

    <text x="32" y="650" class="sans cream place">TÚNEL PINTOR</text>
    <text x="32" y="690" class="sans cream place">ANTÔNIO BANDEIRA</text>
    <text x="32" y="735" class="sans" fill="#a8adb3" font-size="25" font-weight="600">FORTALEZA · CE</text>
    <text x="32" y="790" class="sans handle" fill="#67e8df">@fcmefestival</text>
  </g>

  <g transform="translate(572 520)">
    <rect width="456" height="830" rx="16" fill="#13180c" stroke="#c9ff4a" stroke-width="4"/>
    <rect x="20" y="20" width="416" height="18" rx="9" fill="#c9ff4a"/>
    <text x="32" y="98" class="sans label" fill="#c9ff4a">02 · CAUCAIA</text>
    <text x="32" y="195" class="condensed cream event">NATURAÍZ</text>
    <line x1="32" y1="235" x2="424" y2="235" stroke="#c9ff4a" stroke-opacity=".55" stroke-width="2"/>

    <text x="32" y="346" class="condensed cream date">25–26 JUL</text>
    <text x="32" y="397" class="sans place" fill="#c9ff4a">30 HORAS DE SOM</text>

    <g transform="translate(32 475)" fill="none" stroke="#c9ff4a" stroke-width="5">
      <path d="M0 50H392"/>
      <circle cx="0" cy="50" r="12" fill="#c9ff4a"/>
      <circle cx="196" cy="50" r="12" fill="#13180c"/>
      <circle cx="392" cy="50" r="12" fill="#c9ff4a"/>
      <path d="M68 20v60M128 35v30M264 35v30M324 20v60" stroke-opacity=".55"/>
    </g>

    <text x="32" y="650" class="sans cream place">MEMENTO MORI</text>
    <text x="32" y="690" class="sans cream place">MARATONA PSY</text>
    <text x="32" y="735" class="sans" fill="#a8adb3" font-size="25" font-weight="600">CAUCAIA · CE</text>
    <text x="32" y="790" class="sans handle" fill="#c9ff4a">@naturaizceara</text>
  </g>

  <g transform="translate(1064 520)">
    <rect width="456" height="830" rx="16" fill="#1a0d17" stroke="#ff5c9d" stroke-width="4"/>
    <rect x="20" y="20" width="416" height="18" rx="9" fill="#ff5c9d"/>
    <text x="32" y="98" class="sans label" fill="#ff5c9d">03 · NAZARÉ PAULISTA</text>
    <text x="32" y="185" class="condensed cream" font-size="52" font-weight="900" letter-spacing="-2">COSMIC CREW</text>
    <line x1="32" y1="235" x2="424" y2="235" stroke="#ff5c9d" stroke-opacity=".55" stroke-width="2"/>

    <text x="32" y="332" class="condensed cream" font-size="60" font-weight="900" letter-spacing="-2">31 JUL–02 AGO</text>
    <text x="32" y="397" class="sans place" fill="#ff5c9d">23 ANOS</text>

    <g transform="translate(32 475)" fill="none" stroke="#ff5c9d" stroke-width="5">
      <path d="M0 50H392"/>
      <circle cx="0" cy="50" r="12" fill="#ff5c9d"/>
      <circle cx="196" cy="50" r="12" fill="#1a0d17"/>
      <circle cx="392" cy="50" r="12" fill="#ff5c9d"/>
      <path d="M68 20v60M128 35v30M264 35v30M324 20v60" stroke-opacity=".55"/>
    </g>

    <text x="32" y="650" class="sans cream place">ESTÂNCIA</text>
    <text x="32" y="690" class="sans cream place">NAZARÉ PAULISTA</text>
    <text x="32" y="735" class="sans" fill="#a8adb3" font-size="25" font-weight="600">SÃO PAULO · SP</text>
    <text x="32" y="790" class="sans handle" fill="#ff5c9d">@cosmic.crew</text>
  </g>

  <g transform="translate(80 1414)">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#f5efe3" stroke-opacity=".6" stroke-width="2"/>
    <text x="0" y="76" class="sans cream" font-size="34" font-weight="800" letter-spacing="2">LINE-UPS, HORÁRIOS E SERVIÇO COMPLETO</text>
    <text x="1440" y="76" text-anchor="end" class="sans" fill="#c7c8cb" font-size="28" font-weight="700">SONICSEARCH.APP</text>
  </g>
</svg>
